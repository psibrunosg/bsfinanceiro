version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bsfinanceiro-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bsfinanceiro
      - POSTGRES_USER=bstrainer
      - POSTGRES_PASSWORD=eTEklwZkO8dwrbazpVzeQpOXWwVraRcS7x48
    volumes:
      - bsfinanceiro-db-data:/var/lib/postgresql/data
      - ./database/full_production_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bsfinanceiro-frontend
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - deploy-nginx-fpm_default

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: bsfinanceiro-api
    environment:
      - DB_HOST=bsfinanceiro-db
      - DB_PORT=5432
      - DB_NAME=bsfinanceiro
      - DB_USER=bstrainer
      - DB_PASSWORD=eTEklwZkO8dwrbazpVzeQpOXWwVraRcS7x48
    volumes:
      - /opt/backups/bsfinanceiro:/opt/backups/bsfinanceiro:ro
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - default
      - deploy-nginx-fpm_default

volumes:
  bsfinanceiro-db-data:

networks:
  default:
  deploy-nginx-fpm_default:
    external: true

